<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" id="bryn-door" class="bryn-door" role="img" aria-labelledby="bryn-door-title">
<title id="bryn-door-title">Bryn the Trail Guide waving hello in her red trail shell and felt hat, her walking pole in her other hand</title>
<!--
  bryn-door: Bryn as a collectible vinyl-toy figure on the WilsonWorks character model (Kody's and Louise's door figures), standing
  square to you. Transparent background, a soft shadow under her boots. Drawn by tools/art/door.js; edit that file.
  The head (x 48 to 152, y 22 to 118) is bigger than the small body. Felt hat with a moss band, chestnut fringe and a braid
  over her shoulder with an ochre tie, freckles, big cartoon eyes with catch-lights, an open smile. Red trail shell, sage
  trousers, brown boots. One hand holds her pole; the other waves.
  Motion: .bryn-door-wave turns the raised forearm about the elbow (2.4 s). Only with prefers-reduced-motion: no-preference;
  the still pose is the wave.
-->
<style>@media (prefers-reduced-motion: no-preference){#bryn-door .bryn-door-wave{transform-box:view-box;transform-origin:152px 138px;animation:bryn-door-wave 2.4s ease-in-out infinite}
@keyframes bryn-door-wave{0%,100%{transform:rotate(0deg)}20%{transform:rotate(-10deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-9deg)}80%{transform:rotate(3deg)}}}</style>
